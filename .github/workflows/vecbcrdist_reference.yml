name: vecBCRdist reference validation

on:
  push:
  pull_request:
    branches:
      - main
      - dev

jobs:
  convbench-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AMULETY and fixed reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[vecbcrdist-reference]"
      - name: Checkout the fixed ConvBench reference
        uses: actions/checkout@v4
        with:
          repository: Kleinstein-Lab/convbench
          ref: 65a425db711b9d6e94900d430c672e60098b8ab6
          path: .reference/convbench
      - name: Verify the ConvBench revision
        run: test "$(git -C .reference/convbench rev-parse HEAD)" = "65a425db711b9d6e94900d430c672e60098b8ab6"
      - name: Compare vecBCRdist with ConvBench BCRdist
        env:
          CONVBENCH_TCRDIST3_PATH: ${{ github.workspace }}/.reference/convbench/bin/tcrdist3.py
        run: pytest -q tests/test_bcr_embeddings.py -k vec_bcrdist_matches_convbench_bcrdist
